n>JANX<span style=\"color:#F28C28\">.<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goLogin }}\" style=\"min-height:44px;padding:0 8px;border:0;background:transparent;color:#0B1F4B;font-size:15px;font-weight:600;cursor:pointer\">Connexion<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1 1 auto\">\n\n  <!-- ============ ACCUEIL ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <section style=\"background:#0B1F4B;color:#FFFFFF\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:48px 20px 56px;display:flex;flex-wrap:wrap;align-items:center;gap:48px 40px\">\n          <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n            <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#F6B26B\">Dakar, Sénégal<\u002Fp>\n            <h1 style=\"margin:0;max-width:760px;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(34px,6.5vw,60px);line-height:1.05;text-wrap:balance\">Trouvez la bonne personne, simplement.<\u002Fh1>\n            <p style=\"margin:0;max-width:560px;font-size:18px;line-height:1.55;color:#D5DDF0\">Parcourez gratuitement les profils de femmes de ménage près de chez vous. Photo, présentation écrite et vocale, disponibilités : tout est visible sans créer de compte.<\u002Fp>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;max-width:760px;margin-top:8px\">\n              <label for=\"qHome\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap\">Rechercher un quartier, une ville ou une compétence<\u002Flabel>\n              <input id=\"qHome\" type=\"search\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Quartier, ville ou compétence\" autocomplete=\"off\" style=\"flex:1 1 260px;min-width:0;min-height:52px;padding:0 16px;border-radius:8px;border:2px solid #FFFFFF;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ goDir }}\" style=\"flex:0 0 auto;min-height:52px;padding:0 28px;border-radius:8px;border:0;background:#F28C28;color:#0B1F4B;font-size:16px;font-weight:600;cursor:pointer\">Rechercher<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n              <span style=\"font-size:14px;color:#B9C5E3\">Recherches fréquentes<\u002Fspan>\n              <sc-for list=\"{{ quickPicks }}\" as=\"pick\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ pick.go }}\" style=\"min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #5B6E9E;background:transparent;color:#FFFFFF;font-size:14px;cursor:pointer\">{{ pick.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;max-width:760px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ goRegisterCand }}\" style=\"flex:1 1 220px;min-height:52px;padding:0 24px;border-radius:999px;border:0;background:#FFFFFF;color:#0B1F4B;font-size:16px;font-weight:600;cursor:pointer\">Je cherche du travail<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 340px;min-width:0;max-width:520px;position:relative\">\n            <img src=\"e641e169-e87c-44a1-b7db-3d753b04110f\" alt=\"Femme de ménage souriante, foulard en wax, dans une cuisine à Dakar\" style=\"display:block;width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px\">\n            <div style=\"position:absolute;left:12px;bottom:-18px;padding:10px 20px;border-radius:999px;background:#FFFFFF;color:#0B1F4B;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,0.25)\">\n              <span style=\"font-size:13px;color:#4A5878\">Profil vérifié<\u002Fspan>\n              <span style=\"font-size:16px;font-weight:600\">Awa · Sacré-Cœur<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:#F4F7FD\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:56px 20px;display:flex;flex-direction:column;gap:28px\">\n          <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1\">Comment ça marche<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n            <div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:28px;border-radius:12px;background:#FFFFFF;border:1px solid #DDE3F0\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <h3 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Vous cherchez une femme de ménage<\u002Fh3>\n                <p style=\"margin:0;font-size:15px;font-weight:600;color:#9A4A00\">Gratuit, sans compte pour consulter l'annuaire<\u002Fp>\n              <\u002Fdiv>\n              <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5\">\n                <li>Cherchez par quartier, compétence, expérience ou disponibilité.<\u002Fli>\n                <li>Consultez la photo, la présentation écrite et l'enregistrement vocal.<\u002Fli>\n                <li>Appelez ou écrivez sur WhatsApp si le numéro est public. Sinon, utilisez la messagerie JANX après avoir créé un compte employeuse.<\u002Fli>\n              <\u002Fol>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:28px;border-radius:12px;background:#FFFFFF;border:1px solid #DDE3F0\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <h3 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Vous êtes femme de ménage<\u002Fh3>\n                <p style=\"margin:0;font-size:15px;font-weight:600;color:#9A4A00\">Publication du profil : 2 000 FCFA<\u002Fp>\n              <\u002Fdiv>\n              <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5\">\n                <li>Créez votre profil avec une photo, votre âge, votre quartier et une courte biographie. L'enregistrement vocal est facultatif.<\u002Fli>\n                <li>Payez par Wave ou Orange Money. Votre profil est publié dès que JANX a vérifié la réception du paiement.<\u002Fli>\n                <li>Gagnez en visibilité avec l'offre Premium, en option : 7, 15 ou 30 jours en tête de l'annuaire.<\u002Fli>\n              <\u002Fol>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:#F28C28;color:#0B1F4B\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:48px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n          <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:8px\">\n            <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;text-wrap:balance\">Vous êtes femme de ménage à Dakar ?<\u002Fh2>\n            <p style=\"margin:0;font-size:17px;line-height:1.5;max-width:560px\">Présentez-vous aux employeuses avec votre photo et votre voix. Les premières candidates peuvent publier leur profil gratuitement pendant la campagne de lancement.<\u002Fp>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ goRegisterCand }}\" style=\"flex:0 0 auto;min-height:52px;padding:0 28px;border-radius:8px;border:0;background:#0B1F4B;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer\">Créer mon profil<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <footer id=\"contact\" style=\"background:#0B1F4B;color:#D5DDF0\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:44px 20px;display:flex;flex-direction:column;gap:28px\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px 40px\">\n            <div style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:28px;letter-spacing:0.04em;color:#FFFFFF\">JANX<\u002Fspan>\n              <span style=\"font-size:15px\">Trouvez la bonne personne, simplement.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px\">\n              <span style=\"font-weight:600;color:#FFFFFF\">Informations<\u002Fspan>\n              <span style=\"padding:8px 0\">Conditions générales d'utilisation<\u002Fspan>\n              <span style=\"padding:8px 0\">Politique de confidentialité<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px\">\n              <span style=\"font-weight:600;color:#FFFFFF\">Contact<\u002Fspan>\n              <span style=\"padding:8px 0\">[E-MAIL DE CONTACT JANX]<\u002Fspan>\n              <span style=\"padding:8px 0\">[NUMÉRO DE CONTACT JANX]<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;padding-top:20px;border-top:1px solid #34497E;font-size:14px;line-height:1.5;color:#B9C5E3\">JANX est une plateforme de mise en relation. JANX n'est pas l'employeur des candidates et n'intervient pas dans les accords conclus entre employeuses et candidates.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Ffooter>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ANNUAIRE ============ -->\n  <sc-if value=\"{{ isDir }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"max-width:1180px;margin:0 auto;padding:36px 20px 16px;display:flex;flex-direction:column;gap:20px\">\n        <h1 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(32px,5vw,44px);line-height:1.1\">Annuaire<\u002Fh1>\n        <div style=\"position:relative;max-width:640px\">\n          <label for=\"qDir\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap\">Rechercher un quartier, une ville ou une compétence<\u002Flabel>\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A5878\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"position:absolute;left:16px;top:15px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4-4\"><\u002Fpath><\u002Fsvg>\n          <input id=\"qDir\" type=\"search\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Quartier, ville ou compétence\" autocomplete=\"off\" style=\"width:100%;min-height:52px;padding:0 16px 0 50px;border-radius:999px;border:1px solid #9AA9CC;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n        <\u002Fdiv>\n        <div role=\"group\" aria-label=\"Filtrer par disponibilité\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ availChips }}\" as=\"chip\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ chip.go }}\" aria-pressed=\"{{ chip.active }}\" style=\"{{ chip.style }}\">{{ chip.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;color:#4A5878\">{{ resultCount }} · Profils d'exemple, photos à ajouter<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showFeatured }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px\">\n            <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Profils à la une<\u002Fh2>\n            <span style=\"font-size:14px;color:#4A5878\">Profils sponsorisés<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px\">\n            <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <article style=\"min-width:0;display:flex;flex-direction:column;border:2px solid #F28C28;border-radius:12px;background:#FFFFFF;overflow:hidden\">\n                <div style=\"position:relative;width:100%;max-width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:{{ p.tint }}\">\n                  <span style=\"font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:80px;color:#0B1F4B;opacity:0.85\">{{ p.initials }}<\u002Fspan>\n                  <span style=\"position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;background:#F28C28;color:#0B1F4B;font-size:13px;font-weight:600\">Premium<\u002Fspan>\n                  <sc-if value=\"{{ p.voice }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"position:absolute;bottom:12px;left:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#0B1F4B;color:#FFFFFF;font-size:13px;font-weight:500\">\n                      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\u002Fpath><\u002Fsvg>\n                      Présentation vocale\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;padding:18px\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px\">\n                    <h3 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:20px\">{{ p.name }}<\u002Fh3>\n                    <span style=\"font-size:14px;color:#4A5878\">{{ p.ageLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:14px;font-weight:500;color:#4A5878\">{{ p.place }}<\u002Fp>\n                  <p style=\"margin:0;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">{{ p.bio }}<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ p.skills }}\" as=\"skill\" hint-placeholder-count=\"3\">\n                      <span style=\"padding:4px 10px;border-radius:999px;background:#EAEFFA;color:#0B1F4B;font-size:13px\">{{ skill.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px;font-size:14px;color:#4A5878\">\n                    <span>Expérience : {{ p.exp }}<\u002Fspan>\n                    <span>{{ p.availText }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <button type=\"button\" style=\"margin-top:8px;min-height:48px;border-radius:8px;border:0;background:#0B1F4B;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer\">Voir le profil<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showOthers }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:16px 20px 48px;display:flex;flex-direction:column;gap:20px\">\n          <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Découvrir les profils<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px\">\n            <sc-for list=\"{{ others }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <article style=\"min-width:0;display:flex;flex-direction:column;border:1px solid #C9D3EA;border-radius:12px;background:#FFFFFF;overflow:hidden\">\n                <div style=\"position:relative;width:100%;max-width:100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:{{ p.tint }}\">\n                  <span style=\"font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:80px;color:#0B1F4B;opacity:0.85\">{{ p.initials }}<\u002Fspan>\n                  <sc-if value=\"{{ p.voice }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"position:absolute;bottom:12px;left:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#0B1F4B;color:#FFFFFF;font-size:13px;font-weight:500\">\n                      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\u002Fpath><\u002Fsvg>\n                      Présentation vocale\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;padding:18px\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px\">\n                    <h3 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:20px\">{{ p.name }}<\u002Fh3>\n                    <span style=\"font-size:14px;color:#4A5878\">{{ p.ageLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:14px;font-weight:500;color:#4A5878\">{{ p.place }}<\u002Fp>\n                  <p style=\"margin:0;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">{{ p.bio }}<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ p.skills }}\" as=\"skill\" hint-placeholder-count=\"3\">\n                      <span style=\"padding:4px 10px;border-radius:999px;background:#EAEFFA;color:#0B1F4B;font-size:13px\">{{ skill.label }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px;font-size:14px;color:#4A5878\">\n                    <span>Expérience : {{ p.exp }}<\u002Fspan>\n                    <span>{{ p.availText }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <button type=\"button\" style=\"margin-top:8px;min-height:48px;border-radius:8px;border:0;background:#0B1F4B;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer\">Voir le profil<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:16px 20px 56px\">\n          <div style=\"padding:32px 24px;border:1px dashed #9AA9CC;border-radius:12px;background:#F4F7FD;display:flex;flex-direction:column;gap:8px\">\n            <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Aucun profil ne correspond à votre recherche<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.5;color:#4A5878\">Essayez un autre quartier, une autre compétence, ou retirez un filtre de disponibilité.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ MESSAGES ============ -->\n  <sc-if value=\"{{ isMsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:560px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:20px\">\n      <h1 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(32px,5vw,44px);line-height:1.1\">Messages<\u002Fh1>\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding:28px;border-radius:12px;background:#F4F7FD;border:1px solid #DDE3F0\">\n        <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B1F4B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\u002Fpath><\u002Fsvg>\n        <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:22px\">Connectez-vous pour voir vos messages<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:#4A5878\">La messagerie JANX est réservée aux comptes connectés. Consulter l'annuaire reste gratuit et sans compte.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goLogin }}\" style=\"min-height:48px;padding:0 24px;border-radius:8px;border:0;background:#0B1F4B;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer\">Se connecter<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goRegisterEmp }}\" style=\"min-height:48px;padding:0 24px;border-radius:8px;border:1px solid #0B1F4B;background:#FFFFFF;color:#0B1F4B;font-size:16px;font-weight:600;cursor:pointer\">Créer un compte employeuse<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ CONNEXION / INSCRIPTION ============ -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:520px;margin:0 auto;padding:36px 20px 56px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <h1 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(32px,5vw,44px);line-height:1.1\">{{ authTitle }}<\u002Fh1>\n        <p style=\"margin:0;font-size:14px;color:#4A5878\">Maquette de présentation : les vrais comptes se créent dans l'application JANX.<\u002Fp>\n      <\u002Fdiv>\n\n      <div role=\"group\" aria-label=\"Connexion ou inscription\" style=\"display:flex;gap:8px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showLoginTab }}\" aria-pressed=\"{{ isLoginTab }}\" style=\"{{ tabLoginStyle }}\">Connexion<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ showRegisterTab }}\" aria-pressed=\"{{ isRegisterTab }}\" style=\"{{ tabRegisterStyle }}\">Créer un compte<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- Formulaire de connexion -->\n      <sc-if value=\"{{ isLoginTab }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onLogin }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"loginId\" style=\"font-size:14px;font-weight:600\">E-mail ou numéro de téléphone<\u002Flabel>\n            <input id=\"loginId\" type=\"text\" autocomplete=\"username\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"loginPwd\" style=\"font-size:14px;font-weight:600\">Mot de passe<\u002Flabel>\n            <input id=\"loginPwd\" type=\"password\" autocomplete=\"current-password\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"min-height:52px;border-radius:8px;border:0;background:#F28C28;color:#0B1F4B;font-size:16px;font-weight:600;cursor:pointer\">Se connecter<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onForgot }}\" style=\"min-height:44px;border:0;background:transparent;color:#0B1F4B;font-size:15px;font-weight:500;text-decoration:underline;cursor:pointer\">Mot de passe oublié ?<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <!-- Formulaire d'inscription -->\n      <sc-if value=\"{{ isRegisterTab }}\" hint-placeholder-val=\"{{ false }}\">\n        <form sc-camel-on-submit=\"{{ onRegister }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n          <div role=\"group\" aria-label=\"Type de compte\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ pickEmployer }}\" aria-pressed=\"{{ isEmployer }}\" style=\"{{ roleEmpStyle }}\">Je cherche une femme de ménage<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ pickCandidate }}\" aria-pressed=\"{{ isCandidate }}\" style=\"{{ roleCandStyle }}\">Je suis femme de ménage<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isCandidate }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:12px 14px;border-radius:8px;background:#FFF1E0;font-size:14px;line-height:1.5;color:#5A2E00\">La publication du profil coûte 2 000 FCFA. Les premières candidates peuvent publier gratuitement pendant la campagne de lancement.<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n            <div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px\">\n              <label for=\"regFirst\" style=\"font-size:14px;font-weight:600\">Prénom<\u002Flabel>\n              <input id=\"regFirst\" type=\"text\" autocomplete=\"given-name\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n            <\u002Fdiv>\n            <div style=\"flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px\">\n              <label for=\"regLast\" style=\"font-size:14px;font-weight:600\">Nom<\u002Flabel>\n              <input id=\"regLast\" type=\"text\" autocomplete=\"family-name\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"regEmail\" style=\"font-size:14px;font-weight:600\">Adresse e-mail<\u002Flabel>\n            <input id=\"regEmail\" type=\"email\" autocomplete=\"email\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"regPhone\" style=\"font-size:14px;font-weight:600\">Numéro de téléphone<\u002Flabel>\n            <input id=\"regPhone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"77 000 00 00\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label for=\"regPwd\" style=\"font-size:14px;font-weight:600\">Mot de passe<\u002Flabel>\n            <input id=\"regPwd\" type=\"password\" autocomplete=\"new-password\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"min-height:52px;border-radius:8px;border:0;background:#F28C28;color:#0B1F4B;font-size:16px;font-weight:600;cursor:pointer\">Créer mon compte<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <p role=\"status\" style=\"margin:0;padding:12px 14px;border-radius:8px;background:#EAEFFA;font-size:14px;line-height:1.5;color:#0B1F4B\">{{ noteText }}<\u002Fp>\n      <\u002Fsc-if>\n\n      <div style=\"padding-top:12px;border-top:1px solid #DDE3F0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px\">\n        <span style=\"font-size:14px;color:#4A5878\">Propriétaire de JANX ?<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ goAdmin }}\" style=\"min-height:44px;padding:0 4px;border:0;background:transparent;color:#0B1F4B;font-size:15px;font-weight:600;text-decoration:underline;cursor:pointer\">Accès administrateur<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ COMPTE ADMINISTRATEUR ============ -->\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:560px;margin:0 auto;padding:36px 20px 56px;display:flex;flex-direction:column;gap:20px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goLogin }}\" style=\"align-self:flex-start;min-height:44px;padding:0;border:0;background:transparent;color:#0B1F4B;font-size:15px;font-weight:600;cursor:pointer\">← Retour à la connexion<\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <h1 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:clamp(30px,5vw,40px);line-height:1.1\">Compte administrateur<\u002Fh1>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:#4A5878\">Première configuration du compte principal du propriétaire de JANX.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:12px;background:#F4F7FD;border:1px solid #DDE3F0\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <label for=\"adminEmail\" style=\"font-size:14px;font-weight:600\">Adresse e-mail de l'administrateur<\u002Flabel>\n          <input id=\"adminEmail\" type=\"email\" value=\"{{ adminEmail }}\" sc-camel-on-change=\"{{ onAdminEmail }}\" style=\"width:100%;min-height:52px;padding:0 14px;border:1px solid #9AA9CC;border-radius:8px;background:#FFFFFF;color:#0B1F4B;font-size:16px\">\n          <span style=\"font-size:13px;line-height:1.4;color:#4A5878\">Le lien de configuration sera envoyé à cette adresse.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:14px;font-weight:600\">Numéro de téléphone<\u002Fspan>\n          <span style=\"font-size:18px\">77 752 96 56<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:14px;font-weight:600\">Rôle<\u002Fspan>\n          <span style=\"font-size:16px\">Administrateur principal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <h2 style=\"margin:0;font-family:Space Grotesk,Inter,sans-serif;font-weight:700;font-size:20px\">Comment vous choisissez votre mot de passe<\u002Fh2>\n        <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.5\">\n          <li>Le compte est créé côté serveur. Aucune inscription publique ne donne ce rôle.<\u002Fli>\n          <li>Un lien sécurisé est envoyé à l'adresse e-mail ci-dessus.<\u002Fli>\n          <li>Vous choisissez vous-même votre mot de passe sur la page du lien.<\u002Fli>\n          <li>Vous accédez ensuite au tableau de bord administrateur.<\u002Fli>\n        <\u002Fol>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#4A5878\">Le mot de passe n'est écrit nulle part dans le code ni dans cette page.<\u002Fp>\n      <\u002Fdiv>\n\n      <button type=\"button\" sc-camel-on-click=\"{{ onAdminSend }}\" style=\"min-height:52px;border-radius:8px;border:0;background:#0B1F4B;color:#FFFFFF;font-size:16px;font-weight:600;cursor:pointer\">Envoyer le lien de configuration<\u002Fbutton>\n\n      <sc-if value=\"{{ adminSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <p role=\"status\" style=\"margin:0;padding:12px 14px;border-radius:8px;background:#EAEFFA;font-size:14px;line-height:1.5;color:#0B1F4B\">Aucun e-mail n'a été envoyé : cette page est une maquette. Dans l'application JANX, le lien part vers l'adresse ci-dessus.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- Barre de navigation du bas -->\n  <nav aria-label=\"Navigation mobile\" style=\"position:sticky;bottom:0;z-index:20;display:flex;background:#FFFFFF;border-top:1px solid #DDE3F0\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" aria-current=\"{{ curHome }}\" style=\"{{ tabHomeStyle }}\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\u002Fpath><\u002Fsvg>\n      <span>Accueil<\u002Fspan>\n    <\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goDir }}\" aria-current=\"{{ curDir }}\" style=\"{{ tabDirStyle }}\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4-4\"><\u002Fpath><\u002Fsvg>\n      <span>Annuaire<\u002Fspan>\n    <\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goMsg }}\" aria-current=\"{{ curMsg }}\" style=\"{{ tabMsgStyle }}\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\u002Fpath><\u002Fsvg>\n      <span>Messages<\u002Fspan>\n    <\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goLogin }}\" aria-current=\"{{ curLogin }}\" style=\"{{ tabLoginStyle2 }}\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21a8 8 0 0 1 16 0\"><\u002Fpath><\u002Fsvg>\n      <span>Connexion<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fnav>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3700}}\">\nclass Component extends DCLogic {\n  norm(s) {\n    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');\n  }\n\n  profiles() {\n    return [\n      { id: 1, first: 'Awa', last: 'Diallo', age: 34, place: 'Unité 15, Parcelles Assainies, Dakar', bio: 'Sérieuse et organisée, je m’occupe de l’entretien complet de la maison, de la cuisine et du repassage. Je travaille avec soin et dans le respect des horaires.', skills: ['Ménage général', 'Cuisine', 'Repassage'], exp: 'plus de 5 ans', availText: 'Disponible immédiatement · Temps plein', immediate: true, full: true, part: false, live: false, premium: true, voice: true, tint: '#DCE4F5' },\n      { id: 2, first
